# Test, then deploy every push to main to the Vultr server (deploy/README.md).
# Secrets: DEPLOY_HOST, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS.
# Variables (public Auth0 SPA values): VITE_AUTH0_DOMAIN, VITE_AUTH0_CLIENT_ID, VITE_AUTH0_AUDIENCE.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in order; a newer push waits rather than cancelling a live deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend
        run: pip install -r backend/requirements-dev.txt -c deploy/constraints.txt
      - name: Backend tests and lint
        working-directory: backend
        run: |
          python -m pytest -q
          python -m ruff check app tests scripts

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend type check and tests
        working-directory: frontend
        run: |
          npm ci
          npx tsc -b
          node --test --test-concurrency=1 tests/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
        run: deploy/deploy.sh "root@${{ secrets.DEPLOY_HOST }}"

      - name: Check the live site
        run: |
          host="$(echo '${{ secrets.DEPLOY_HOST }}' | tr . -).sslip.io"
          curl -fsS -m 10 "https://$host/health"
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://$host/api/sites")" = 401

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
